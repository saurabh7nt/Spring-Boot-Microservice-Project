spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8083

# External Service URLs
services:
  user-service:
    url: http://localhost:8081
  medicine-service:
    url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,beans"